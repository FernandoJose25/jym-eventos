name: CI

on:
  push:
    branches: [main]
  pull_request:

# Configuración pública ficticia: solo para que el SDK cliente de Firebase se
# inicialice durante el prerender. Las páginas usan sus datos de respaldo.
env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin, redes, luminex-redes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
        working-directory: apps/${{ matrix.app }}
      - run: pnpm --filter ${{ matrix.app }} build
